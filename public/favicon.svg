<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Plate Gradient -->
    <linearGradient id="d1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15082e"/>
      <stop offset="60%" stop-color="#080314"/>
      <stop offset="100%" stop-color="#020006"/>
    </linearGradient>

    <!-- Outer Rim Starlight Border -->
    <linearGradient id="d1_rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Left Wing Gradient (Electric Violet) -->
    <linearGradient id="d1_wingL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f5d0fe"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Right Wing Gradient (Neon Lilac) -->
    <linearGradient id="d1_wingR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f0abfc"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>

    <!-- Center Keystone / Starlight Core -->
    <linearGradient id="d1_core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Radial Bloom -->
    <radialGradient id="d1_bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container Squircle with Precision Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="16" fill="url(#d1_bg)" stroke="url(#d1_rim)" stroke-width="1.8"/>

  <!-- Subtle Core Glow -->
  <circle cx="32" cy="32" r="21" fill="url(#d1_bloom)"/>

  <!-- Left Chevron / Wing of M -->
  <!-- Constructed with 45/60 degree chamfers for razor-sharp optical weight -->
  <path d="
    M 12 48
    L 12 19
    C 12 17.5 13.5 16.5 14.8 17.2
    L 28.5 25.5
    C 29.5 26.1 30 27.2 30 28.5
    L 30 48
    C 30 49 29 49.5 28 49.5
    L 24 49.5
    C 23 49.5 22 49 22 48
    L 22 30
    L 18 27.5
    L 18 48
    C 18 49 17 49.5 16 49.5
    L 14 49.5
    C 13 49.5 12 49 12 48
    Z
  " fill="url(#d1_wingL)"/>

  <!-- Right Chevron / Wing of M -->
  <path d="
    M 52 48
    L 52 19
    C 52 17.5 50.5 16.5 49.2 17.2
    L 35.5 25.5
    C 34.5 26.1 34 27.2 34 28.5
    L 34 48
    C 34 49 35 49.5 36 49.5
    L 40 49.5
    C 41 49.5 42 49 42 48
    L 42 30
    L 46 27.5
    L 46 48
    C 46 49 47 49.5 48 49.5
    L 50 49.5
    C 51 49.5 52 49 52 48
    Z
  " fill="url(#d1_wingR)"/>

  <!-- Center Floating Diamond Beacon (Starlight Singularity ✦) -->
  <path d="
    M 32 15
    L 35.5 20.5
    L 32 26
    L 28.5 20.5
    Z
  " fill="url(#d1_core)"/>
  <circle cx="32" cy="20.5" r="1.2" fill="#ffffff"/>
</svg>